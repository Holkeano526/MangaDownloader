version: '3.8'

services:
  discord_bot:
    # En el NAS se usa la receta OMV "manga-downloader" (Dockerfile.bot sobre la base congelada).
    build: .
    container_name: manga_discord_bot
    volumes:
      - ./PDF:/app/PDF
      - ./Media:/app/Media
      - ./.env:/app/.env
    restart: unless-stopped
    environment:
      - HEADLESS=true
    command: python bot.py
